<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Descrição exibida nos resultados de busca do Google -->
  <meta name="description" content="Cafézes — Cafés especiais e equipamentos para barismo.">
  <link rel="stylesheet" href="css/style.css">
  <title>Cafézes — Café do seu jeito</title>
</head>
<body>

  <!-- ========== CABEÇALHO ========== -->
  <header class="topo">
    <div class="logo">
      <a href="index.html">Café<span>Zes</span></a>
    </div>
    <nav class="menu">
      <!-- "ativo" destaca o link da página atual no menu -->
      <a href="index.html" class="ativo">Home</a>
      <a href="pages/sobre.html">Sobre</a>
      <a href="pages/produtos.html">Produtos</a>
      <a href="pages/contato.html">Contato</a>
    </nav>
  </header>

  <!-- ========== HERO ========== -->
  <!-- Tela de boas-vindas com título, slogan e botões de ação -->
  <section class="hero">
    <div class="hero-content">
      <h1>Café<em>Zes</em></h1>
      <p>Cafés especiais e equipamentos para quem leva o café a sério.</p>
      <div class="hero-botoes">
        <!-- Botão sólido → leva para a lista de produtos -->
        <a href="pages/produtos.html" class="btn-primario">Ver Produtos</a>
        <!-- Botão transparente → leva para o formulário de contato -->
        <a href="pages/contato.html" class="btn-secundario">Entre em Contato</a>
      </div>
    </div>
  </section>

  <!-- ========== RODAPÉ ========== -->
  <footer class="rodape">
    <p>© 2025 Cafézes. Todos os direitos reservados.</p>
    <p><a href="pages/contato.html">Entre em contato</a></p>
  </footer>

</body>
</html>
