<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <title>Contato — Cafézes</title>
</head>
<body>

  <!-- ========== CABEÇALHO ========== -->
  <header class="topo">
    <div class="logo">
      <a href="../index.html">Café<span>Zes</span></a>
    </div>
    <nav class="menu">
      <a href="../index.html">Home</a>
      <a href="sobre.html">Sobre</a>
      <a href="produtos.html">Produtos</a>
      <a href="contato.html" class="ativo">Contato</a>
    </nav>
  </header>

  <!-- ========== FORMULÁRIO ========== -->
  <!-- O JS em contato.js intercepta o submit e envia para o servidor -->
  <section class="contato">
    <h2>Fale Conosco</h2>
    <span class="contato-subtitulo">Estamos aqui para ajudar — envie sua mensagem</span>

    <form id="formContato">
      <!-- Para adicionar um campo: copie um .campo-grupo e ajuste id/label/placeholder -->
      <div class="campo-grupo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>
      </div>

      <div class="campo-grupo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="campo-grupo">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" rows="5" placeholder="Como podemos ajudar?"></textarea>
      </div>

      <button type="submit">Enviar Mensagem</button>
    </form>

    <!-- O JS alterna qual mensagem fica visível após o envio -->
    <p id="msg-sucesso" class="msg-feedback sucesso">✦ Mensagem enviada com sucesso!</p>
    <p id="msg-erro"    class="msg-feedback erro">Erro ao enviar. Tente novamente.</p>
  </section>

  <!-- ========== RODAPÉ ========== -->
  <footer class="rodape">
    <p>© 2025 Cafézes. Todos os direitos reservados.</p>
    <p><a href="contato.html">Entre em contato</a></p>
  </footer>

  <!-- Carrega o JS do formulário — deve ficar no fim do body -->
  <script src="../js/contato.js"></script>

</body>
</html>
